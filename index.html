           background-image: repeating-linear-gradient(transparent 0 25px, #c9bea233 25px 26px); }

<body>
<div id="manual" hidden>
  <div id="mbar"><span id="mClock">0:00</span><span id="mStrikes"></span><span id="mInfo"></span></div>
  <div id="tabs"></div>
  <div id="pages"></div>
</div>
<canvas id="game"></canvas>
<div class="hud" id="top"><span id="phase"></span><span id="role" hidden></span></div>
<div class="hud" id="msg"></div>
<div id="side">
  <div id="hint"></div>
  <div id="chat"></div>
  <div id="quick"></div>
  <form id="say"><input id="sayText" maxlength="100" placeholder="Say something…" autocomplete="off" enterkeyhint="send"><input id="name" maxlength="14" autocomplete="off" aria-label="Your name"><button>Send</button></form>
</div>
<div class="hud" id="net">Connecting…</div>
<div class="over" id="over" hidden><div class="card">
  <h2 id="oTitle"></h2><div id="oWhy"></div><div id="oYou" class="y"></div>

  <button class="go" id="again">Play again</button><div id="oNext"></div>
</div></div>
<script>
/* ═══ BOMB DEFUSE · a Multiplayer Agent starter ═════════════════════════════════════════════
 * One player holds the bomb. Everyone else holds the manual. Talk fast. Co-op, 2–6 players.
 * Alone? Tock, a bot, reads the manual to you.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: clock, strikes, levels, the bot's reading speed
 *   THE MANUAL .... the rules as data: wires, the button, keypad columns, mazes. Change a rule
 *                   here and the manual pages, the checks and the bot all follow.
 *   BOMB MAKER .... a bomb from a seed (serial, wires, button, keypad, maze) and its answers
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: the bomb is encrypted so only the defuser can see it
 *   GAME (HOST) ... phases (brief, armed, defused, boom), picking the defuser, the clock and
 *                   strikes, checking every cut and press, chat, taking over as a new host
 *   BOT (HOST) .... Tock reads the right page to a lone defuser; the ?attract autopilot
 *   ME ............ opening my bomb, cutting, pressing, holding, walking the maze
 *   DRAW .......... the bomb and its four modules, particles, flashes
 *   SCREENS ....... manual pages, HUD, banners, hints, chat, results, leaderboard, sounds
 *   INPUT ......... tap/click the bomb, arrow keys or WASD for the maze, quick chat, Enter to chat
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key) once, and
 *     `hb` (heartbeat) once a second.
 *   - The HOST is the lowest sessionId among live players, worked out every frame. Only the
 *     host writes shared fields: `game` (phase, level, who defuses, the clock as a timestamp
 *     and a speed, strikes, solved modules, the streak; `v` goes up on every write), `bomb`
 *     (the bomb's seed and progress, SEALED to the defuser; its own `v`) and `chat`.
 *   - The bomb is HIDDEN: only the defuser can open `bomb`. The manual is plain: it is the
 *     same for every bomb. The host makes the bomb, so it can read it too.
 *   - Intents to the host: "act" (cut a wire, press/hold/let go of the button, press a key,
 *     step in the maze), "chat", "ready". The host checks each one against the bomb.
 *   - When the host changes, the defuser re-sends its bomb (sealed) to the new host ("role");
 *     a new host asks for it with "who". The clock keeps running from its timestamp.
 *   - ?attract plays offline: you defuse on autopilot while Tock reads (the preview video).
 *   - Leaderboard "bombs-defused": the most bombs your team defused in a row.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  maxStrikes: 3,          // this many mistakes and it blows
  strikeSpeedup: 0.25,    // each strike makes the clock run this much faster (0.25 = 25%)
  holdMs: 600,            // pressing the button longer than this counts as holding it
  levels: [               // bomb 1, 2, 3…; past the last one, each bomb loses timeDrop seconds
    { mods: ["wires", "button"], secs: 150 },
    { mods: ["wires", "keypad", "button"], secs: 180 },
    { mods: ["wires", "keypad", "maze", "button"], secs: 210 },
  ],
  timeDrop: 15,           // seconds less per bomb after the last level…
  minSecs: 120,           // …but never less than this
  briefMs: 5000,          // "X has the bomb" before the clock starts
  defusedMs: 4500,        // the "Defused!" banner before the next bomb
  offMs: 3500,            // the defuser walked away: banner before a new defuser takes over
  overMs: 15000,          // results screen after a boom
  leaveMs: 6000,          // a defuser silent this long walks away from the bomb
  rejoinMs: 2500,         // a new host waits this long for the bomb to be re-sent
  chatLines: 8,           // chat lines kept in state
  chatMax: 100,           // characters per chat line
  botLineMs: [2600, 3800],// Tock's pause between lines (ms)
  botRepeatMs: 9000,      // Tock repeats a rule if you haven't acted on it
  botName: "Tock",        // the bot that reads the manual to a lone defuser
  board: "bombs-defused", // leaderboard: bombs defused in a row
};
const FRIENDLY = ["Sparky", "Fuse", "Pliers", "Rivet", "Volt", "Gizmo", "Widget", "Socket", "Bolt", "Cog"];
const COLORS = ["#ff6b5e", "#4fa3ff", "#ffcf3f", "#3ee08a", "#c38bff", "#ff8fd1", "#5ee0e0", "#ffa94d"];
const QUICK = {
  defuser: ["3 wires", "4 wires", "5 wires", "6 wires", "Serial ends odd", "Serial ends even", "Red", "Blue", "Yellow", "White", "Black", "Holding it…", "Done ✓", "What next?", "Wait!"],
  expert: ["How many wires?", "Last wire color?", "Serial odd or even?", "Button color + word?", "Tap it", "Hold it", "Let go NOW", "Up", "Down", "Left", "Right", "Which symbols?", "Where are the circles?", "Next module", "Slow down!"],
};

// ── THE MANUAL ──────────────────────────────────────────────────────────────────────
// Wires are counted from the top. The first rule that is true says which wire to cut.
// `say` is the rule as Tock reads it; `when(w, b)` checks it; `cut(w, b)` is the wire to cut (0 = top).
const WIRE_COLORS = { red: "#e5413b", blue: "#3b7be5", yellow: "#f2c230", white: "#eef0f2", black: "#26282d" };
const count = (w, c) => w.filter((x) => x === c).length;
const lastOf = (w, c) => w.lastIndexOf(c);
const WIRE_RULES = {
  3: [
    { say: "If the top wire is blue, cut the last wire.", when: (w) => w[0] === "blue", cut: (w) => w.length - 1 },
    { say: "If there are two or more red wires, cut the first red wire.", when: (w) => count(w, "red") >= 2, cut: (w) => w.indexOf("red") },
    { say: "Cut the middle wire.", when: () => true, cut: () => 1 },
  ],
  4: [
    { say: "If there are no yellow wires, cut the third wire.", when: (w) => !count(w, "yellow"), cut: () => 2 },
    { say: "If the serial ends in an even digit, cut the last yellow wire.", when: (w, b) => !b.odd, cut: (w) => lastOf(w, "yellow") },
    { say: "If the last wire is black, cut the first wire.", when: (w) => w[3] === "black", cut: () => 0 },
    { say: "Cut the second wire.", when: () => true, cut: () => 1 },
  ],
  5: [
    { say: "If there is exactly one white wire, cut the white wire.", when: (w) => count(w, "white") === 1, cut: (w) => w.indexOf("white") },
    { say: "If the serial ends odd and the top wire is red, cut the fourth wire.", when: (w, b) => b.odd && w[0] === "red", cut: () => 3 },
    { say: "If there are more blue wires than red ones, cut the last blue wire.", when: (w) => count(w, "blue") > count(w, "red"), cut: (w) => lastOf(w, "blue") },
    { say: "Cut the first wire.", when: () => true, cut: () => 0 },
  ],
  6: [
    { say: "If there are no red wires, cut the fifth wire.", when: (w) => !count(w, "red"), cut: () => 4 },
    { say: "If the last two wires are the same color, cut the last wire.", when: (w) => w[4] === w[5], cut: () => 5 },
    { say: "If the serial ends in an even digit, cut the second wire.", when: (w, b) => !b.odd, cut: () => 1 },
    { say: "Cut the third wire.", when: () => true, cut: () => 2 },
  ],
};
// The big button. The first rule that is true says tap (press and let go at once) or hold.
const BUTTON_COLORS = { red: "#d93a2f", blue: "#2f6fd9", yellow: "#f0bd22", white: "#e9ecef" };
const BUTTON_WORDS = ["ABORT", "HOLD", "PRESS", "STOP"];
const BUTTON_RULES = [
  { say: "If the button is blue and says ABORT, hold it.", when: (b) => b.btn.color === "blue" && b.btn.word === "ABORT", hold: true },
  { say: "If the button is red and says HOLD, tap it.", when: (b) => b.btn.color === "red" && b.btn.word === "HOLD", hold: false },
  { say: "If the button is white and the serial ends odd, hold it.", when: (b) => b.btn.color === "white" && b.odd, hold: true },
  { say: "If the button says STOP, tap it.", when: (b) => b.btn.word === "STOP", hold: false },
  { say: "If the button is yellow, hold it.", when: (b) => b.btn.color === "yellow", hold: true },
  { say: "Tap it.", when: () => true, hold: false },
];
// Holding: a strip lights up beside the button. Let go when the countdown shows this digit anywhere.
const STRIP_DIGIT = { blue: 4, yellow: 5, red: 2, white: 1 };
// The keypad. Exactly one column holds all four of the bomb's symbols: press them in that column's order.
// [symbol, nickname]. Symbols are plain text characters, so no images are needed.
const SYMBOLS = { "Ω": "horseshoe", "Ψ": "trident", "λ": "tent", "π": "table", "Σ": "zigzag", "Δ": "triangle", "Ж": "bug", "Ф": "lollipop",
  "Я": "backwards R", "§": "snake", "¶": "flag", "©": "copyright", "¿": "upside-down ?", "∞": "eight", "‡": "dagger", "¥": "yen",
  "€": "euro", "★": "star", "☆": "hollow star", "♠": "spade", "♣": "club", "♥": "heart", "♪": "note", "Þ": "thorn" };
const KEY_COLUMNS = [
  ["Ω", "Ψ", "λ", "★", "¶", "Ж"],
  ["π", "Ω", "Σ", "♪", "Δ", "©"],
  ["Ж", "¿", "∞", "Ψ", "♠", "‡"],
  ["¥", "Δ", "€", "☆", "♣", "¿"],
  ["Ф", "Я", "★", "♥", "€", "§"],
  ["‡", "Þ", "♥", "λ", "©", "♣"],
];
// The mazes: 6×6, made from these seeds. Two green circles tell the mazes apart.
const MAZE_SIZE = 6, MAZE_SEEDS = [1101, 2207, 3313, 4421], MAZE_NAMES = ["A", "B", "C", "D"];
const DIRS = { U: [0, -1, "up"], D: [0, 1, "down"], L: [-1, 0, "left"], R: [1, 0, "right"] };

// ── BOMB MAKER ──────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pickR = (r, a) => a[Math.floor(r() * a.length)];
/** A maze: walls[y][x] = { r, d } (wall to the right, wall below), and two marker cells. */
function makeMaze(seed) {
  const r = mulberry32(seed), N = MAZE_SIZE, walls = Array.from({ length: N }, () => Array.from({ length: N }, () => ({ r: true, d: true })));
  const seen = new Set(["0,0"]), stack = [[0, 0]];
  while (stack.length) { // carve a path through every cell (depth-first)
    const [x, y] = stack[stack.length - 1];
    const next = Object.values(DIRS).map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < N && b < N && !seen.has(a + "," + b));
    if (!next.length) { stack.pop(); continue; }
    const [nx, ny] = pickR(r, next);
    if (nx > x) walls[y][x].r = false; else if (nx < x) walls[y][nx].r = false; else if (ny > y) walls[y][x].d = false; else walls[ny][x].d = false;
    seen.add(nx + "," + ny); stack.push([nx, ny]);
  }
  const m1 = [Math.floor(r() * N), Math.floor(r() * N)];
  let m2; do m2 = [Math.floor(r() * N), Math.floor(r() * N)]; while (Math.abs(m2[0] - m1[0]) + Math.abs(m2[1] - m1[1]) < 3);
  return { walls, marks: [m1, m2] };
}
const MAZES = MAZE_SEEDS.map(makeMaze);
function canStep(maze, x, y, d) {
  const [dx, dy] = DIRS[d], nx = x + dx, ny = y + dy;
  if (nx < 0 || ny < 0 || nx >= MAZE_SIZE || ny >= MAZE_SIZE) return false;
  if (dx === 1) return !maze.walls[y][x].r; if (dx === -1) return !maze.walls[y][nx].r;
  if (dy === 1) return !maze.walls[y][x].d; return !maze.walls[ny][x].d;
}
/** Shortest list of steps ("U", "R", …) from a cell to the goal. */
function mazePath(maze, from, to) {
  const key = (p) => p[0] + "," + p[1], prev = new Map([[key(from), null]]), q = [from];
  while (q.length) {
    const p = q.shift();
    if (key(p) === key(to)) break;
    for (const d of Object.keys(DIRS)) if (canStep(maze, p[0], p[1], d)) { const n = [p[0] + DIRS[d][0], p[1] + DIRS[d][1]]; if (!prev.has(key(n))) { prev.set(key(n), [p, d]); q.push(n); } }
  }
  const out = []; let k = key(to);
  while (prev.get(k)) { const [p, d] = prev.get(k); out.unshift(d); k = key(p); }
  return out;
}
/** Everything on a bomb, from its seed. Every client with the seed builds the same bomb. */
function makeBomb(seed, mods) {
  const r = mulberry32(seed), L = "ABCDEFGHJKLMNPRSTUVWXZ";
  const serial = pickR(r, L) + pickR(r, L) + Math.floor(r() * 10) + "-" + pickR(r, L) + Math.floor(r() * 10);
  const b = { seed, mods, serial, odd: +serial[serial.length - 1] % 2 === 1 };
  const nw = 3 + Math.floor(r() * 4);
  b.wires = Array.from({ length: nw }, () => pickR(r, Object.keys(WIRE_COLORS)));
  b.btn = { color: pickR(r, Object.keys(BUTTON_COLORS)), word: pickR(r, BUTTON_WORDS), strip: pickR(r, Object.keys(STRIP_DIGIT)) };
  for (let tries = 0; ; tries++) { // four symbols that only one column holds all of
    const col = Math.floor(r() * KEY_COLUMNS.length), syms = [...KEY_COLUMNS[col]];
    for (let i = syms.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [syms[i], syms[j]] = [syms[j], syms[i]]; } // same order in every browser
    syms.length = 4;
    if (tries > 50 || KEY_COLUMNS.filter((c) => syms.every((s) => c.includes(s))).length === 1) { b.keys = { col, syms }; break; }
  }
  b.maze = { i: Math.floor(r() * MAZES.length) };
  const m = MAZES[b.maze.i], cell = () => [Math.floor(r() * MAZE_SIZE), Math.floor(r() * MAZE_SIZE)];
  b.maze.start = cell();
  do b.maze.goal = cell(); while (mazePath(m, b.maze.start, b.maze.goal).length < 5);
  return b;

  const max = BOMB_AT.w - 64, lines = [""];
  for (const w of text.split(" ")) { const t = lines[lines.length - 1] ? lines[lines.length - 1] + " " + w : w; if (ctx.measureText(t).width > max && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = t; }
  const ls = lines.slice(0, 2), tw = Math.max(...ls.map((l) => ctx.measureText(l).width)) + 24, bh = 14 + ls.length * 19, bx = BOMB_AT.x + (BOMB_AT.w - tw) / 2, by = BOMB_AT.y + BOMB_AT.h - bh - 10;
  ctx.fillStyle = "#fffdf3"; rr(bx, by, tw, bh, 12); ctx.fill();
  ctx.fillStyle = "#2a2418"; ls.forEach((l, i) => ctx.fillText(l, bx + 12, by + 17 + i * 19));
}
function draw(g, now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const mb = myBomb(g), showBomb = !!g && (ATTRACT || amDefuser(g));
  if (showBomb) {
    drawBench();
    ctx.save(); if (now < shakeUntil) ctx.translate(Math.sin(now / 17) * 6, Math.cos(now / 23) * 5);
    if (g.ph === "boom") drawRubble(g, now); else if (mb || g.ph === "brief") drawBomb(g, mb, now);
    ctx.restore();
    if (ATTRACT) drawBubble(now);
  } else { ctx.clearRect(0, 0, W, H); HITS = []; }
  drawParticles(dt);
  if (now < flashUntil) { ctx.globalAlpha = Math.min(0.55, (flashUntil - now) / 600); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
/** After a boom: scorch and smoke where the bomb was. */
function drawRubble(g, now) {
  const A = BOMB_AT, cx = A.x + A.w / 2, cy = A.y + A.h / 2, t = (now - phaseAt) / 1000;
  const gr = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.min(A.w, A.h) * 0.5);
  gr.addColorStop(0, "#000"); gr.addColorStop(0.6, "#1a0f0a"); gr.addColorStop(1, "rgba(20,10,5,0)"); ctx.fillStyle = gr; circle(cx, cy, Math.min(A.w, A.h) * 0.5); ctx.fill();
  for (let i = 0; i < 9; i++) { const a = i * 0.7 + t * 0.2, r = 40 + ((i * 37) % 60) + t * 12; ctx.fillStyle = `rgba(90,90,96,${Math.max(0, 0.35 - t * 0.03)})`; circle(cx + Math.cos(a) * r, cy - t * 20 + Math.sin(a) * r * 0.5, 30 + i * 3); ctx.fill(); }
}

// ── SCREENS ─────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const secs = (ms) => Math.max(0, Math.ceil(ms / 1000));
function fmtClock(ms) { const s = secs(ms); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
const clockSecs = (str) => { const [m, s] = String(str).split(":").map(Number); return (m || 0) * 60 + (s || 0); };
const MOD_NAMES = { wires: "Wires", button: "The Button", keypad: "Keypad", maze: "Maze" };
let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function tone(f, ms, type = "sine", vol = 0.05, f2 = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + ms / 1000);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + ms / 1000);
}

/** The manual pages, built once from THE MANUAL data. */
function buildManual() {
  const ol = (rules, mod) => "<ol>" + rules.map((r, i) => `<li data-r="${mod}${i}">${i ? "Otherwise, " + r.say[0].toLowerCase() + r.say.slice(1) : r.say}</li>`).join("") + "</ol>";
  const pages = {
    wires: `<h3>Wires</h3><p>Count the wires from the top. Use the list for that many wires: the FIRST rule that is true says which wire to cut. Cut only that one.</p>`
      + Object.keys(WIRE_RULES).map((n) => `<h4>${n} wires</h4>` + ol(WIRE_RULES[n], "w" + n + "-")).join(""),
    button: `<h3>The Button</h3><p>Ask for the button's color and its word. The first rule that is true says what to do. Tap = press and let go at once.</p>` + ol(BUTTON_RULES, "b")
      + `<h4>Holding it</h4><p>A strip lights up beside the button. Let go when the countdown shows this digit anywhere:</p><table class="strip">`
      + Object.entries(STRIP_DIGIT).map(([c, d]) => `<tr><td>${c} strip</td><td><b>${d}</b></td></tr>`).join("") + "</table>",
    keypad: `<h3>Keypad</h3><p>The bomb shows four symbols. Exactly one column below has all four. Press them in that column's order, top to bottom. A wrong key is a strike.</p><div class="cols">`
      + KEY_COLUMNS.map((c, i) => `<div><b>${i + 1}</b>${c.map((s) => `<span>${s}<i>${SYMBOLS[s]}</i></span>`).join("")}</div>`).join("") + "</div>",
    maze: `<h3>Maze</h3><p>Find the maze whose two green circles are in the same places as the bomb's. Talk the white square to the red triangle, one step at a time. Walking into a wall is a strike. The bomb doesn't show the walls.</p><div class="mazes">`
      + MAZES.map((_, i) => `<figure><canvas data-maze="${i}" width="240" height="240"></canvas>Maze ${MAZE_NAMES[i]}</figure>`).join("") + "</div>",
  };
  $("tabs").innerHTML = Object.keys(pages).map((p) => `<button data-p="${p}">${MOD_NAMES[p]}</button>`).join("");
  $("pages").innerHTML = Object.entries(pages).map(([p, html]) => `<section data-p="${p}">${html}</section>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => showPage(b.dataset.p)));
  $("pages").querySelectorAll("canvas[data-maze]").forEach((c) => drawMazePage(c, MAZES[+c.dataset.maze]));
  showPage("wires");
}
let page = "";
function showPage(p) {
  page = p;
  $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.p === p));
  $("pages").querySelectorAll("section").forEach((s) => (s.hidden = s.dataset.p !== p));
  $("pages").scrollTop = 0;
}
/** One maze as the manual shows it: walls, and the two green circles. */
function drawMazePage(c, m) {
  const x = c.getContext("2d"), s = c.width, pad = 14, cell = (s - pad * 2) / MAZE_SIZE;
  x.fillStyle = "#fffaf0"; x.fillRect(0, 0, s, s);
  x.strokeStyle = "#2b2418"; x.lineWidth = 4; x.lineCap = "round"; x.strokeRect(pad, pad, s - pad * 2, s - pad * 2);
  for (let yy = 0; yy < MAZE_SIZE; yy++) for (let xx = 0; xx < MAZE_SIZE; xx++) {
    const px = pad + xx * cell, py = pad + yy * cell, w = m.walls[yy][xx];
    x.fillStyle = "#c9bea2"; x.beginPath(); x.arc(px + cell / 2, py + cell / 2, 3, 0, 7); x.fill();
    x.beginPath(); if (w.r && xx < MAZE_SIZE - 1) { x.moveTo(px + cell, py); x.lineTo(px + cell, py + cell); } if (w.d && yy < MAZE_SIZE - 1) { x.moveTo(px, py + cell); x.lineTo(px + cell, py + cell); } x.stroke();
  }
  x.strokeStyle = "#1c8a4e"; x.lineWidth = 4;
  for (const mk of m.marks) { x.beginPath(); x.arc(pad + (mk[0] + 0.5) * cell, pad + (mk[1] + 0.5) * cell, cell * 0.32, 0, 7); x.stroke(); }
}

/** Sounds, sparks and flashes for what just changed in state (effects only: nothing here decides anything). */
const seen = { key: "", strikes: 0, solved: 0, bomb: -1, chat: -1, sec: -1 };
let phaseAt = 0;
function effects(g, now) {
  const key = g.bomb + ":" + g.ph, first = seen.bomb === -1;
  if (g.bomb !== seen.bomb) { seen.bomb = g.bomb; seen.strikes = g.strikes; seen.solved = g.solved.length; holdStart = 0; keyAt.clear(); solvedAt.clear(); }
  if (key !== seen.key) {
    seen.key = key; phaseAt = now;
    if (!first) {
      const cx = BOMB_AT.x + BOMB_AT.w / 2, cy = BOMB_AT.y + BOMB_AT.h / 2;
      if (g.ph === "armed") { tone(880, 120, "square", 0.04); setTimeout(() => tone(1320, 160, "square", 0.04), 130); }
      if (g.ph === "defused") { burst(cx, cy, ["#3ee08a", "#ffcf3f", "#4fa3ff", "#ff8fd1", "#fff"], 120, 520, 320); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 220, "triangle", 0.06), i * 110)); }
      if (g.ph === "boom") { burst(cx, cy, ["#ff3b2e", "#ffa94d", "#ffcf3f", "#555", "#222"], 160, 700, 200); flashUntil = now + 900; flashColor = "#fff2d0"; shakeUntil = now + 900; tone(70, 1200, "sawtooth", 0.12, 30); }
    }
    fit();
  }
  if (g.strikes > seen.strikes) { flashUntil = now + 500; flashColor = "#ff2a1f"; shakeUntil = now + 350; tone(110, 380, "sawtooth", 0.09, 70); }
  seen.strikes = g.strikes;
  if (g.solved.length > seen.solved) { for (const m of g.solved.slice(seen.solved)) solvedAt.set(m, now); tone(988, 120, "triangle", 0.06); setTimeout(() => tone(1319, 180, "triangle", 0.06), 100); }
  seen.solved = g.solved.length;
  const s = secs(timeLeft(g));
  if (g.ph === "armed" && s !== seen.sec) { seen.sec = s; tone(s < 30 ? 1500 : 1100, 30, "square", s < 30 ? 0.03 : 0.015); }
  const c = shared("chat", null);
  if (c && c.c !== seen.chat) { if (seen.chat >= 0) tone(900 + Math.random() * 300, 50, "sine", 0.02); seen.chat = c.c; }
}

function phaseText(g) {
  const left = fmtClock(timeLeft(g));
  return { brief: `BOMB ${g.lvl} · starts in ${secs(g.endsAt - Date.now())}s`, armed: `BOMB ${g.lvl} · ${left}`, defused: "DEFUSED", off: "CALLED OFF", boom: "BOOM" }[g.ph] || "";
}
function banner(g) {
  const t = Date.now(), me = amDefuser(g), d = esc(nameOf(g.def));
  if (g.ph === "brief") return !g.def ? "Waiting for a defuser…" : me ? `You have the bomb!<small>${soloRoom() ? `${CONFIG.botName} reads you the manual. Listen, then act fast.` : "Tell the others what you see. They have the manual."}</small>`
    : `${d} has the bomb<small>You have the manual. Ask what they see.</small>`;
  if (g.ph === "armed") return t < g.at + 1500 ? "Go!" : "";
  if (g.ph === "defused") return `<span class="g">Defused!</span><small>${fmtClock(g.left)} left · ${g.streak} in a row. Next bomb is harder.</small>`;
  if (g.ph === "off") return `${d} walked away<small>This bomb is called off. Someone else takes the next one.</small>`;
  return "";
}
function hint(g) {
  if (g.ph === "boom") return "";
  if (amDefuser(g)) return soloRoom() ? `${CONFIG.botName} reads the manual. Tap to cut, press and hold; arrows or tap the grid for the maze.` : "Describe what you see. Tap to cut and press; arrows/WASD or tap the grid to walk the maze.";
  return `Ask ${esc(nameOf(g.def))} what's on the bomb, find the page, say what to do.`;
}
let chatRaw = null, quickFor = "";
function hud(g) {
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the bomb" : ""}`;
  if (!g) return;
  const me = amDefuser(g);
  $("phase").textContent = phaseText(g);
  const role = ATTRACT ? "" : me ? "You: DEFUSER" : "You: MANUAL";
  $("role").hidden = !role; $("role").textContent = role;
  const b = banner(g), html = b ? `<span class="b">${b}</span>` : "";
  if ($("msg").innerHTML !== html) $("msg").innerHTML = html;
  // the manual: experts always, and the right half in ?attract
  const showManual = ATTRACT || !me;
  $("manual").hidden = !showManual; cv.classList.toggle("ghost", !me && !ATTRACT);
  if (showManual) {
    $("mClock").textContent = g.ph === "brief" ? fmtClock(g.left) : fmtClock(timeLeft(g));
    $("mStrikes").textContent = "✖".repeat(g.strikes) + "·".repeat(Math.max(0, CONFIG.maxStrikes - g.strikes));
    $("mInfo").textContent = `Bomb ${g.lvl}: ${g.mods.map((m) => MOD_NAMES[m] + (g.solved.includes(m) ? " ✓" : "")).join(" · ")}${g.rate > 1 ? ` · clock ×${g.rate.toFixed(2)}` : ""}`;
    $("tabs").querySelectorAll("button").forEach((x) => { x.classList.toggle("live", g.mods.includes(x.dataset.p)); x.classList.toggle("done", g.solved.includes(x.dataset.p)); });
    if (ATTRACT) attractPage(g);
  }
  if (ATTRACT) return;
  const h = hint(g);
  if ($("hint").innerHTML !== h) $("hint").innerHTML = h;
  const qset = me ? "defuser" : "expert";
  if (quickFor !== qset) { quickFor = qset; $("quick").innerHTML = QUICK[qset].map((q) => `<button type="button">${esc(q)}</button>`).join(""); }
  if (S.shared.chat !== chatRaw) {
    chatRaw = S.shared.chat;
    const c = shared("chat", null), lines = c && c.l.length ? c.l : [["", "Say hi. Quick-chat buttons are below, or just talk out loud."]];
    $("chat").innerHTML = lines.map(([id, text]) => id ? `<div><b style="color:${esc(colorOf(id))}">${esc(nameOf(id))}</b>${esc(text)}</div>` : `<div class="sys">${esc(text)}</div>`).join("");
    $("chat").scrollTop = 1e6;
  }
  renderOver(g);
}
/** ?attract: the manual follows Tock, open at the page and rule it is reading. */
function attractPage(g) {
  const s = host.secret, focus = g.mods.find((m) => !g.solved.includes(m));
  if (!focus || !s) return;
  if (focus !== page) showPage(focus);
  const b = bombOf(s.seed, g.mods);
  const id = focus === "wires" ? `w${b.wires.length}-${WIRE_RULES[b.wires.length].indexOf(wireRule(b))}` : focus === "button" ? `b${BUTTON_RULES.indexOf(buttonRule(b))}` : "";
  $("pages").querySelectorAll("li").forEach((li) => li.classList.toggle("hl", host.bot && host.bot.step >= 2 && li.dataset.r === id));
  const li = id && $("pages").querySelector(`li[data-r="${id}"]`);
  if (li && host.bot && host.bot.step >= 2) $("pages").scrollTop = li.offsetTop - $("pages").clientHeight * 0.4;
}
let overFor = -1, board = null;
function renderOver(g) {
  $("over").hidden = g.ph !== "boom" || ATTRACT;
  if (g.ph !== "boom") return;
  $("oTitle").innerHTML = '<span class="r">BOOM!</span>';
  $("oWhy").textContent = g.why === "time" ? "The clock ran out." : `${CONFIG.maxStrikes} strikes. The bomb had enough.`;
  $("oNext").textContent = `Next run in ${secs(g.endsAt - Date.now())}s`;
  $("again").textContent = g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (overFor === g.bomb) return;
  overFor = g.bomb;
  $("oYou").textContent = g.streak ? `Your team defused ${g.streak} bomb${g.streak === 1 ? "" : "s"} in a row.` : "No bombs defused this run. Next time!";
  const list = $("board");
  if (!board) { list.innerHTML = '<li class="note">Leaderboards need a connection.</li>'; return; } // status lines are not numbered entries
  list.innerHTML = '<li class="note">Loading the leaderboard…</li>';
  (g.streak > 0 ? board.submit(g.streak).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : '<li class="note">No runs yet. Be the first.</li>';
  }).catch(() => { list.innerHTML = '<li class="note">Couldn\'t load the leaderboard.</li>'; });
}
/** Two players picked one color (they joined at once): the later sessionId moves. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && myColor !== colorOf("bot")) return;
  const taken = new Set([...others.map(([, p]) => p.c), colorOf("bot")]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const hitAt = (x, y) => HITS.find((h) => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (document.activeElement === $("sayText") && e.pointerType !== "mouse") $("sayText").blur();
  if (e.button !== 0) return; // only the main button (a right-click would press the button and lose the let-go)
  const h = hitAt(e.clientX, e.clientY);
  if (!h || ATTRACT) return;
  if (h.m === "wires") { act({ m: "wires", i: h.k }); tone(1800, 40, "square", 0.04); burst(e.clientX, e.clientY, ["#e08a3c", "#ffcf3f"], 10, 140); }
  else if (h.m === "button") { pressButton(); cv.setPointerCapture(e.pointerId); }
  else if (h.m === "keypad") pressKey(h.k);
  else if (h.m === "maze") step(h.k);
  else if (h.m === "mazegrid") { const dx = e.clientX - h.ux, dy = e.clientY - h.uy; if (Math.hypot(dx, dy) > 8) step(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : dy > 0 ? "D" : "U"); }
});
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerup", () => releaseButton());
cv.addEventListener("pointercancel", () => releaseButton());
$("quick").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { unlockAudio(); toHost("chat", { t: b.textContent }); } });
$("say").addEventListener("submit", (e) => {
  e.preventDefault(); unlockAudio();
  const text = $("sayText").value.trim();
  if (text) toHost("chat", { t: text });
  $("sayText").value = "";
});
$("again").addEventListener("click", () => toHost("ready", { r: 1 }));
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});
addEventListener("keydown", (e) => {
  unlockAudio();
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  const d = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", KeyW: "U", KeyS: "D", KeyA: "L", KeyD: "R" }[e.code];
  if (d && !typing && !e.repeat && amDefuser(game())) { e.preventDefault(); step(d); }
  if (e.key === "Enter" && !typing) { e.preventDefault(); $("sayText").focus(); }
  if (e.key === "Escape") document.activeElement.blur();
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest("#chat, #pages, #quick, #tabs")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, wasDef = false;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.was = false; host.last = null; host.secret = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  watchHost();
  if (isHost()) hostTick(); else host.was = false;
  const g = game();
  if (g) {
    openBomb(g); effects(g, now); autopilot(g, now);
    if (amDefuser(g) !== wasDef) { wasDef = amDefuser(g); fit(); }
    if (g.ph !== "armed") holdStart = 0;
  }
  draw(g, now, dt);
  if (now - lastHud > 100) { lastHud = now; hud(g); }
}

(async function start() {
  if (ATTRACT) {
    Object.assign(CONFIG, { levels: [{ mods: ["wires", "keypad", "maze", "button"], secs: 75 }], briefMs: 600, defusedMs: 2600, overMs: 3000, botLineMs: [650, 900], botRepeatMs: 2500 });
    $("side").hidden = true; $("top").hidden = true;
  }
  buildManual();
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  for (const [type, fn] of Object.entries(HANDLERS)) net.on(type, (msg, from) => { if (isHost() && msg) fn(from, msg); });
  net.on("role", async (msg, from) => { // the defuser's bomb, re-sent to a new host
    if (!msg || msg.to !== net.sessionId) return;
    const v = await Seal.open(pkOf(from), msg.box);
    if (v && isHost()) learnBomb(from, v);
  });
  net.on("who", (msg, from) => resendBomb(from));
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const pk = await Seal.init().catch(() => "");
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), colorOf("bot")]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  $("name").value = myName;
  net.me.set({ n: myName, c: myColor, hb: Date.now(), pk });
  requestAnimationFrame(frame);
})();
</script>
</body>
